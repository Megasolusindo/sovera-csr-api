version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sovera_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sovera_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sovera_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sovera_core_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:ResulteW212%23@10.10.29.177:5432/sovera?sslmode=disable}
      - REDIS_URL=redis:6379
      - WEBHOOK_SECRET_KEY=super_secret_crawler_key_123
      - JWT_SECRET=super_secret_jwt_key_enterprise
      - AI_API_KEY=${AI_API_KEY}
      - SCRAPER_SERVICE_URL=${SCRAPER_SERVICE_URL:-https://api-scraper.megasolusindo.com/api/v1/scrape-tasks}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-change-me}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://host.docker.internal:4000/api/v1/webhooks/crawler?secret=super_secret_crawler_key_123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sovera_core_worker
    restart: always
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL:-postgres://postgres:ResulteW212%23@10.10.29.177:5432/sovera?sslmode=disable}
      - REDIS_URL=redis:6379
      - WEBHOOK_SECRET_KEY=super_secret_crawler_key_123
      - JWT_SECRET=super_secret_jwt_key_enterprise
      - AI_API_KEY=${AI_API_KEY}
      - SCRAPER_SERVICE_URL=${SCRAPER_SERVICE_URL:-https://api-scraper.megasolusindo.com/api/v1/scrape-tasks}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-change-me}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://host.docker.internal:4000/api/v1/webhooks/crawler?secret=super_secret_crawler_key_123}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
