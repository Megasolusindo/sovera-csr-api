version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sovera_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sovera_core_api
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sovera_core_worker
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      redis:
        condition: service_healthy

  openclaw:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
    container_name: sovera_openclaw
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis:6379
    depends_on:
      - api

volumes:
  redis_data:
